# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - workcompass

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Prepare deployment package
        run: |
          mkdir -p staging
          rsync -a --exclude='.env' --exclude='.env.*' --exclude='**/.DS_Store' backend/ staging/

      - name: Upload backend artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: staging

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AB3E210EC49A4CD9922BBC393AAF23BA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_44A893F3ED8E42BFBD48138EDBA34005 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4C58F0F2F4EE47CBA678291A9D8B4EA6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: workcompass
          slot-name: Production
          package: ./deploy-package
